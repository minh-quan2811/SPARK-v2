<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPARK — Career Intelligence</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Markdown renderer (used by plan_agent) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- ═══ HEADER ═══════════════════════════════════════════════ -->
  <header>
    <div class="logo">SP<b>ARK</b></div>
    <div class="sep"></div>
    <span class="hdr-sub">Career Intelligence Pipeline</span>
    <div class="hdr-status">
      <div class="dot live" id="hdr-dot"></div>
      <span id="hdr-txt">Connecting…</span>
    </div>
  </header>

  <!-- ═══ LAYOUT ══════════════════════════════════════════════ -->
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-label">Agents</div>

      <div class="chip" data-agent="cv_agent" id="chip-cv_agent"
           onclick="focusAgent('cv_agent')">
        <div class="cdot" id="cdot-cv_agent"></div>
        <div class="cinfo">
          <div class="cname">CV Agent</div>
          <div class="cstep" id="cstep-cv_agent">Waiting…</div>
        </div>
        <span class="cbadge" id="cbadge-cv_agent">wait</span>
      </div>

      <div class="chip" data-agent="job_agent" id="chip-job_agent"
           onclick="focusAgent('job_agent')">
        <div class="cdot" id="cdot-job_agent"></div>
        <div class="cinfo">
          <div class="cname">Job Agent</div>
          <div class="cstep" id="cstep-job_agent">Waiting…</div>
        </div>
        <span class="cbadge" id="cbadge-job_agent">wait</span>
      </div>

      <div class="chip" data-agent="curriculum_agent" id="chip-curriculum_agent"
           onclick="focusAgent('curriculum_agent')">
        <div class="cdot" id="cdot-curriculum_agent"></div>
        <div class="cinfo">
          <div class="cname">Curriculum Agent</div>
          <div class="cstep" id="cstep-curriculum_agent">Waiting…</div>
        </div>
        <span class="cbadge" id="cbadge-curriculum_agent">wait</span>
      </div>

      <div class="chip" data-agent="plan_agent" id="chip-plan_agent"
           onclick="focusAgent('plan_agent')">
        <div class="cdot" id="cdot-plan_agent"></div>
        <div class="cinfo">
          <div class="cname">Plan Agent</div>
          <div class="cstep" id="cstep-plan_agent">Waiting…</div>
        </div>
        <span class="cbadge" id="cbadge-plan_agent">wait</span>
      </div>
    </aside>

    <!-- Main panel -->
    <main class="main" id="main"></main>

  </div><!-- /.layout -->

  <!--
    Scripts — load order matters:
      1. constants  (lookup tables)
      2. ui         (DOM helpers — uses constants)
      3. renderers  (HTML builders — uses esc() from ui)
      4. stream     (SSE controller — uses all of the above)
  -->
  <script src="js/constants.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/renderers.js"></script>
  <script src="js/stream.js"></script>

</body>
</html>
