<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPARK — Career Planner</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/form.css" />
</head>
<body>

  <!-- ═══ HEADER ═══════════════════════════════════════════════ -->
  <header>
    <div class="logo">SP<b>ARK</b></div>
    <div class="sep"></div>
    <div class="hdr-sub">Career Intelligence Pipeline</div>
  </header>

  <!-- ═══ PAGE ════════════════════════════════════════════════ -->
  <div class="page">
    <div class="card">

      <div class="card-header">
        <h1>Career Planning Form</h1>
        <p>
          Upload your CV and provide your academic background,
          preferences, and faculty information to generate a
          personalised career roadmap.
        </p>
      </div>

      <form id="sparkForm">
        <div class="grid">

          <!-- Academic year -->
          <div class="field">
            <label for="year">Academic Year</label>
            <select id="year" name="year">
              <option value="1">Year 1</option>
              <option value="2">Year 2</option>
              <option value="3">Year 3</option>
              <option value="4">Year 4</option>
              <option value="5">Year 5</option>
            </select>
          </div>

          <!-- Faculty (searchable) -->
          <div class="field dropdown">
            <label for="facultyInput">Faculty</label>
            <input
              type="text"
              id="facultyInput"
              name="faculty"
              autocomplete="off"
              placeholder="Type your faculty…"
              required
            />
            <div class="dropdown-list" id="facultyDropdown"></div>
          </div>

          <!-- Background -->
          <div class="field full">
            <label for="background">Background</label>
            <textarea
              id="background"
              name="background"
              placeholder="Describe your background, interests, experience, and strengths…"
            ></textarea>
          </div>

          <!-- Preferences -->
          <div class="field full">
            <label for="preferences">Preferences</label>
            <textarea
              id="preferences"
              name="preferences"
              placeholder="Preferred industries, technologies, roles, or career directions…"
            ></textarea>
          </div>

          <!-- Plan preferences -->
          <div class="field full">
            <label for="plan_preferences">Plan Preferences</label>
            <textarea
              id="plan_preferences"
              name="plan_preferences"
              placeholder="Describe the type of roadmap or learning style you want…"
            ></textarea>
          </div>

          <!-- CV upload -->
          <div class="field full">
            <label for="cv_file">Upload CV</label>
            <div class="file-box">
              <input
                type="file"
                id="cv_file"
                name="cv_file"
                accept=".pdf"
                required
              />
            </div>
          </div>

        </div><!-- /.grid -->

        <button type="submit" class="submit-btn">
          Generate Career Roadmap
        </button>
      </form>

    </div><!-- /.card -->
  </div><!-- /.page -->

  <!-- Scripts -->
  <script src="js/faculty-dropdown.js"></script>
  <script src="js/form.js"></script>

</body>
</html>
